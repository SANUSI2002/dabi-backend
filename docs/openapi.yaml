        idempotencyKey:
          type: string
      required:
        - idempotencyKey
    PaystackWebhook:
      type: object
      description: Provider payload. Frontends must never call this endpoint.
      additionalProperties: true
    FulfilmentDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
            - APPROVED_FOR_DISPENSING
            - CLARIFICATION_REQUIRED
            - REJECTED
            - UNABLE_TO_FULFILL
        note:
          type: string
        patientMessage:
          type: string
      required:
        - decision
        - note
    PreparationTransition:
      type: object
      additionalProperties: false
      properties:
        transition:
          type: string
          enum:
            - PREPARING
            - READY_FOR_PICKUP
      required:
        - transition
    DeliveryPartner:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
        isActive:
          type: boolean
      required:
        - displayName
        - isActive
    DeliveryAssignment:
      type: object
      additionalProperties: false
      properties:
        partnerId:
          type: string
          format: uuid
      required:
        - partnerId
    DeliveryTransition:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - PICKED_UP
            - OUT_FOR_DELIVERY
            - DELIVERED
      required:
        - status
    WellnessBooking:
      type: object
      additionalProperties: false
      properties:
        offeringId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        context:
          type: string
      required:
        - offeringId
        - requestedAt
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource is absent or hidden by authorization scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Safe module-scoped server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StorageUnavailable:
      description: Private document storage is not configured or available
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: DOCUMENT_STORAGE_UNAVAILABLE
            message: Document storage is unavailable
