components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Use an access token. Example: Bearer <access-token>"
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          const: error
        message:
          type: string
        code:
          type: string
      required:
        - status
        - message
    Success:
      type: object
      additionalProperties: false
      properties:
        status:
          const: success
        data: {}
      required:
        - status
    PatientRegistration:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 30
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          maxLength: 50
        consentGiven:
          const: true
      required:
        - email
        - password
        - firstName
        - lastName
        - consentGiven
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    RefreshToken:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    Email:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required:
        - email
    PasswordReset:
      type: object
      additionalProperties: false
      properties:
        uid:
          type: string
          format: uuid
        token:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
          format: password
      required:
        - uid
        - token
        - password
        - confirmPassword
    CaregiverRegistration:
      type: object
      additionalProperties: false
      properties:
        account:
          type: object
          additionalProperties: false
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            dateOfBirth:
              type: string
              format: date
            country:
              type: string
              enum:
                - Nigeria
                - Ghana
                - Kenya
                - South Africa
                - United Kingdom
                - United States
                - Other
            state:
              type: string
            city:
              type: string
            password:
              type: string
              format: password
            confirmPassword:
              type: string
              format: password
          required:
            - firstName
            - lastName
            - email
            - phone
            - dateOfBirth
            - country
            - state
            - city
            - password
            - confirmPassword
        caregiverType:
          type: string
          enum:
            - Parent
            - Guardian
            - Spouse
            - Child
            - Sibling
            - Relative
            - Professional caregiver
            - Legal representative
            - Other
        connection:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                mode:
                  const: invite
                relationship:
                  type: string
                inviteContact:
                  type: string
              required:
                - mode
                - relationship
                - inviteContact
            - type: object
              additionalProperties: false
              properties:
                mode:
                  const: connect
                relationship:
                  type: string
                patientReference:
                  type: string
              required:
                - mode
                - relationship
                - patientReference
        consent:
          type: object
          additionalProperties: false
          properties:
            terms:
              const: true
            privacy:
              const: true
          required:
            - terms
            - privacy
      required:
        - account
        - caregiverType
        - connection
        - consent
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          format: email
        dob:
          type:
            - string
            - "null"
          format: date
        blood_type:
          type: string
          enum:
            - A+
            - A-
            - B+
            - B-
            - AB+
            - AB-
            - O+
            - O-
        genotype:
          type: string
          enum:
            - AA
            - AS
            - SS
            - AC
            - SC
        chronic_conditions:
          type: string
        known_allergies:
          type: string
        current_medications:
          type: string
        smoking_status:
          type: string
        alcohol_frequency:
          type: string
        physical_activity:
          type: string
        appointment_reminders:
          type: boolean
        prescription_alerts:
          type: boolean
        health_tips_newsletter:
          type: boolean
        data_sharing_consent:
          type: boolean
        electronic_health_records:
          type: boolean
        emergency_access_permissions:
          type: array
          items:
            type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        emergencyContactRelation:
          type: string
        gender:
          type: string
    SecurityPreference:
      type: object
      additionalProperties: false
      properties:
        two_factor_auth:
          type: boolean
      required:
        - two_factor_auth
    PasswordChange:
      type: object
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
      required:
        - current_password
        - new_password
    DeleteConfirmation:
      type: object
      additionalProperties: false
      properties:
        confirmation:
          const: DELETE
      required:
        - confirmation
    Appointment:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        doctorName:
          type: string
          minLength: 2
          maxLength: 120
