name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        env:
          # Prisma generation validates the URL format but does not connect.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Test
        run: |
          npm test -- --reporter=default --reporter=json --outputFile.json=artifacts/unit-results.json
          node scripts/verify-test-results.mjs artifacts/unit-results.json
      - name: Verify EMR migrations, permissions and workflows in embedded PostgreSQL
        run: |
          npm run test:emr -- --reporter=default --reporter=json --outputFile.json=artifacts/emr-results.json
          node scripts/verify-test-results.mjs artifacts/emr-results.json
      - name: Retain test results for release review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/*-results.json
          if-no-files-found: ignore
